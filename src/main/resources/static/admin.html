<!doctype html><html lang="ru"><meta charset="utf-8"><h1>🧙 Панель администратора</h1><h2>Добавить товар</h2><input id=n placeholder="Название"><input id=d placeholder="Описание"><input id=p type=number step=.01 placeholder="Цена"><input id=q type=number placeholder="Остаток"><button onclick=add()>Добавить</button><h2>Заказы</h2><div id=o></div><script>const names={NEW:'Новый',PROCESSING:'В обработке',SHIPPED:'Отправлен',COMPLETED:'Завершён',CANCELLED:'Отменён'};async function load(){let r=await fetch('/api/admin/orders');if(!r.ok){o.textContent='Нет доступа';return}o.innerHTML=(await r.json()).map(x=>`<p>#${x.id} — ${x.totalPrice} € — <select onchange="st(${x.id},this.value)">${Object.entries(names).map(([v,n])=>`<option value="${v}" ${v==x.status?'selected':''}>${n}</option>`).join('')}</select></p>`).join('')}async function add(){await fetch('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value,description:d.value,price:p.value,quantity:q.value})});alert('Товар добавлен')}async function st(id,s){await fetch('/api/admin/orders/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})})}load()</script></html>

<!doctype html><html lang="ru"><meta charset="utf-8"><title>Вход — Магическая лавка</title><style>body{font-family:Arial;max-width:420px;margin:60px auto;background:#f5efff;color:#24133d;padding:20px}.box{background:#fff;padding:28px;border-radius:14px;box-shadow:0 4px 18px #0001}input,button{box-sizing:border-box;width:100%;padding:11px;margin:6px 0;border-radius:7px;border:1px solid #ccc}button{background:#6b36a5;color:white;border:0;cursor:pointer}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{background:#eee;color:#24133d}.tabs button.active{background:#6b36a5;color:white}.hidden{display:none}#m{min-height:22px}</style><div class=box><h1>🪄 Магическая лавка</h1><div class=tabs><button id=loginTab class=active onclick="show('login')">Войти</button><button id=registerTab onclick="show('register')">Регистрация</button></div><div id=login><input id=l placeholder="Логин или Email"><input id=lp type=password placeholder="Пароль"><button onclick=loginGo()>Войти</button></div><div id=register class=hidden><input id=u placeholder="Логин"><input id=n placeholder="Отображаемое имя"><input id=e placeholder="Email"><input id=ph placeholder="Телефон"><input id=rp type=password placeholder="Пароль"><button onclick=registerGo()>Зарегистрироваться</button></div><p id=m></p></div><script>function show(x){let isLogin=x==='login';login.classList.toggle('hidden',!isLogin);register.classList.toggle('hidden',isLogin);loginTab.classList.toggle('active',isLogin);registerTab.classList.toggle('active',!isLogin);m.textContent=''}async function loginGo(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:l.value,password:lp.value})});let d=await r.json().catch(()=>({}));if(r.ok)location='/';else m.textContent=d.message||d.error||'Ошибка входа'}async function registerGo(){let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,displayName:n.value,email:e.value,phone:ph.value,password:rp.value})});let d=await r.json().catch(()=>({}));if(r.ok)location='/';else m.textContent=d.message||d.error||'Ошибка регистрации'}async function init(){let r=await fetch('/api/me');if(r.ok)location='/'}init()</script></html>

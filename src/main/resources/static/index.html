<!doctype html><html lang="ru"><meta charset="utf-8"><title>Магическая лавка</title><style>body{font-family:Arial;max-width:1000px;margin:30px auto;background:#f5efff;color:#24133d}.card{background:#fff;padding:18px;margin:12px;border-radius:12px;display:inline-block;width:240px;vertical-align:top}input,button,select{padding:9px;margin:5px}button{background:#6b36a5;color:white;border:0;border-radius:6px}a{color:#6b36a5}</style><h1>🪄 Магическая лавка</h1><p id=nav></p><div id=p></div><script>async function init(){let me=await fetch('/api/me');if(!me.ok){location='/auth.html';return}let u=await me.json();let admin=u.role==='ADMIN'?'<a href="/admin.html">Панель администратора</a> · ':'';nav.innerHTML='Вы вошли как <b>'+u.displayName+'</b> · <a href="/orders.html">Заказы</a> · '+admin+'<button onclick="logout()">Выйти</button>';let r=await fetch('/api/products');if(!r.ok){location='/auth.html';return}let a=await r.json();p.innerHTML=a.map(x=>`<div class=card><h2>${x.name}</h2><p>${x.description}</p><b>${x.price} €</b><p>Остаток: ${x.quantity}</p><button onclick="add(${x.id})">В корзину</button></div>`).join('')}async function add(id){let r=await fetch('/api/cart/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:id,quantity:1})});alert(r.ok?'Добавлено':'Ошибка')}async function logout(){await fetch('/api/logout',{method:'POST'});location='/auth.html'}init()</script></html>

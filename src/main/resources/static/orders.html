<!doctype html><html lang="ru"><meta charset="utf-8"><h1>Мои заказы</h1><div id=o></div><h2>Оформить заказ</h2><input id=a placeholder="Адрес доставки"><select id=pay><option value="CARD">Карта</option><option value="CASH">Наличные</option></select><button onclick=buy()>Оформить</button><script>const names={NEW:'Новый',PROCESSING:'В обработке',SHIPPED:'Отправлен',COMPLETED:'Завершён',CANCELLED:'Отменён'};async function load(){let r=await fetch('/api/orders');if(!r.ok){o.textContent='Войдите';return}o.innerHTML=(await r.json()).map(x=>`<p>Заказ #${x.id}: ${names[x.status]||x.status}, ${x.totalPrice} €, ${x.deliveryAddress}</p>`).join('')}async function buy(){let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deliveryAddress:a.value,paymentMethod:pay.value})});alert(r.ok?'Заказ создан':'Ошибка');load()}load()</script></html>
